<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mohallo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <!--========================
                NAVBAR
    =========================-->

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="Mohallo">
                <span>Mohallo</span>
            </a>
            <a href="index.html" class="home-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back Home
            </a>
        </nav>
    </header>
    <!--========================
            LOGIN SECTION
    =========================-->
    <section class="login-page">
        <div class="login-container">
            <!--========================
                      LEFT PANEL
            =========================-->
            <div class="left-panel">
                <div class="overlay"></div>
                <div class="left-content">
                    <h1>
                        Welcome Back
                    </h1>
                    <img src="images/community-exchange.png" alt="Mohallo">
                </div>
            </div>
            <!--========================
                    RIGHT PANEL
            =========================-->
            <div class="right-panel">
                <div class="login-card">
                    <h2>
                        Login
                    </h2>
                    <p>
                        Sign in to continue to Mohallo.
                    </p>
                    <form>
                        <div class="input-box">
                            <label>
                                Username / Email
                            </label>
                            <input type="text" placeholder="Enter username or email">
                        </div>
                        <div class="input-box">
                            <label>
                                Password
                            </label>
                            <div class="password-box">
                                <input id="password" type="password" placeholder="Enter password">
                                <i id="togglePassword" class="fa-solid fa-eye">
                                </i>
                            </div>
                        </div>
                        <div class="remember">
                            <label>
                                <input type="checkbox">
                                Remember Me
                            </label>
                            <a href="#">
                                Forgot Password?
                            </a>
                        </div>
                        <button class="login-btn">
                            Login
                        </button>
                        <div class="divider">
                            <span>
                                OR
                            </span>
                        </div>
                        <button type="button" class="phone-btn">
                            <i class="fa-solid fa-phone"></i>
                            Continue with Phone
                        </button>
                        <button type="button" class="google-btn">
                            <i class="fa-brands fa-google"></i>
                            Continue with Google
                        </button>
                        <div class="signup">
                            Don't have an account?
                            <a href="signup.html">
                                Create One
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
    <script src="js/login.js"></script>
</body>

</html>
