<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Verification | Mohallo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/onboarding.css">
</head>

<body data-page="phone">
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="images/logo.png" alt="Mohallo Logo">
                <span>Mohallo</span>
            </a>
            <a href="signup.html" class="home-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back
            </a>
        </nav>
    </header>

    <section class="onboarding-page">
        <div class="onboarding-container">

            <!-- LEFT PANEL -->
            <div class="left-panel">
                <div class="overlay"></div>
                <div class="left-content">
                    <h2 style="color: white;">
                        Verify your mobile number to keep your Mohallo account secure.
                    </h2>
                    <img src="images/phone.png" alt="Phone Illustration">
                </div>
            </div>

            <!-- RIGHT PANEL -->
            <div class="right-panel">
                <div class="onboarding-card">

                    <!-- Progress -->
                    <div class="progress-section">
                        <div class="progress-title">
                            <h4>Secure Your Number</h4>
                            <span>2 / 6</span>
                        </div>
                        <div class="progress">
                            <div class="progress-bar" style="width:33.33%;"></div>
                        </div>
                    </div>
                    <h2>
                        Phone Verification
                    </h2>
                    <p>
                        Enter your mobile number to continue.
                    </p>
                    <form id="phoneForm">
                        <div class="input-box">
                            <label>
                                Mobile Number
                            </label>
                            <div class="phone-input">
                                <span>+91</span>
                                <input type="tel" id="phone" maxlength="10" placeholder="9876543210" required>
                            </div>
                        </div>
                        <button class="continue-btn">
                            <a href="otp.html">
                            Continue
                            </a>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </form>
                    <div class="bottom-link">
                        Wrong name?
                        <a href="signup.html">
                            Go Back
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="../js/onboarding.js"></script>
    <div id="toast" class="toast">
    <div class="toast-icon">
        <i id="toastIcon" class="fa-solid fa-circle-check"></i>
    </div>

    <div class="toast-content">
        <h4 id="toastTitle">Success</h4>
        <p id="toastMessage">Message</p>
    </div>
</div>
</body>
</html>
