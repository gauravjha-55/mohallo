<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | Mohallo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/onboarding.css">

</head>

<body data-page="otp">

    <header>

        <nav class="navbar">

            <a href="index.html" class="logo">

                <img src="images/logo.png" alt="Mohallo">

                <span>Mohallo</span>

            </a>

            <a href="phone.html" class="home-btn">

                <i class="fa-solid fa-arrow-left"></i>

                Back

            </a>

        </nav>

    </header>

    <section class="onboarding-page">

        <div class="onboarding-container">

            <!-- LEFT -->

            <div class="left-panel">

                <div class="overlay"></div>

                <div class="left-content">

                    <h1>

                        Verify OTP

                    </h1>

                    <p>

                        Enter the verification code sent to your mobile number.

                    </p>

                    <img src="images/otp.png" alt="OTP">

                </div>

            </div>

            <!-- RIGHT -->

            <div class="right-panel">

                <div class="onboarding-card">

                    <div class="progress-section">

                        <div class="progress-title">

                            <h4>Secure Your Number</h4>

                            <span>3 / 6</span>

                        </div>

                        <div class="progress">

                            <div class="progress-bar" style="width:50%;"></div>

                        </div>

                    </div>

                    <h2>

                        Verification Code

                    </h2>

                    <p id="phoneDisplay">

                        Enter the 6-digit OTP.

                    </p>

                    <form id="otpForm">

                        <div class="otp-container">

                            <input class="otp-input" maxlength="1">

                            <input class="otp-input" maxlength="1">

                            <input class="otp-input" maxlength="1">

                            <input class="otp-input" maxlength="1">

                            <input class="otp-input" maxlength="1">

                            <input class="otp-input" maxlength="1">

                        </div>

                        <div class="bottom-link">

                            Didn't receive the code?

                            <a href="#" id="resendOtp">

                                Resend OTP

                            </a>

                        </div>

                        <button class="continue-btn" type="submit">

                            Verify

                            <i class="fa-solid fa-arrow-right"></i>

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </section>

    <div id="toast" class="toast">

        <div class="toast-icon">

            <i id="toastIcon" class="fa-solid fa-circle-check"></i>

        </div>

        <div class="toast-content">

            <h4 id="toastTitle">

                Success

            </h4>

            <p id="toastMessage">

                Message

            </p>

        </div>

    </div>

    <script src="js/onboarding.js"></script>

</body>

</html>
